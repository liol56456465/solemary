name: Secret scan (gitleaks)

# Scans the whole git history on every push and pull request. The local pre-push
# hook (scripts/git-hooks/pre-push) can be bypassed with --no-verify; this cannot.
# Old findings that are already dead (reset tokens) are listed in .gitleaksignore.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
          ./gitleaks version

      - name: Scan history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
