# Local Postgres for testing with .env.test.
#   docker compose -f docker-compose.test.yml up -d
# Matching .env.test line:
#   POSTGRES_URL=postgresql://mewvo:mewvo@localhost:5433/mewvo_test
# Port 5433 avoids clashing with a Postgres already running on 5432.
services:
  db-test:
    image: postgres:16-alpine
    container_name: mewvo-test-db
    environment:
      - POSTGRES_USER=mewvo
      - POSTGRES_PASSWORD=mewvo
      - POSTGRES_DB=mewvo_test
    ports:
      - "5433:5432"
    volumes:
      - mewvo_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mewvo -d mewvo_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mewvo_test_data:
